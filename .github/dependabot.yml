version: 2

updates:
  # Workflows pin actions to a commit SHA, which is safe but invisible to a
  # human reading the file. Dependabot is what keeps those pins current, and it
  # updates the trailing version comment along with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - dependencies
    groups:
      # init and analyze are two paths into one action, and CodeQL refuses to
      # run when they are on different releases: analyze aborts with "Loaded a
      # configuration file for version X, but running version Y". Split across
      # separate pull requests, each one holds half the upgrade and can never
      # go green on its own — which is how #8 and #9 both failed. Grouping
      # keeps every codeql-action path in a single pull request.
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  # No npm ecosystem entry: package.json declares no dependencies and exists
  # only to expose the test runner. Add one here if that ever changes.
