name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the tree. Nothing it does needs a
# writable token, so it does not get one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax check and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag. A tag is
      # mutable: whoever controls the action repository can repoint it at new
      # code that runs with this workflow's token. Dependabot proposes SHA
      # bumps, so pinning does not mean going stale.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install step: the site has no runtime dependencies and the test suite
      # uses only node:test and node:assert. `npm ci` would fail for want of a
      # lockfile, and would be pointless if it did not.
      - name: Run tests
        run: npm test
