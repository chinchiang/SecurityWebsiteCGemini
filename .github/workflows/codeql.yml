name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a newly published query still finds an unchanged file.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # security-extended adds the taint-tracking queries that flag exactly the
      # class of defect this repository already shipped: user input reaching an
      # innerHTML sink. The default query pack alone is a weaker net.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      # No build step: this is plain browser JavaScript, so CodeQL extracts the
      # sources directly and autobuild is unnecessary.
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: '/language:javascript-typescript'
